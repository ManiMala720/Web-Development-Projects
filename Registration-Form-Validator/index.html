<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form Validator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="form-container"> 
      <h1>Register</h1>
      <form id="registeration-form">
        <div class="form-elements">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username">
          <small>Username is required</small>
        </div>
        <div class="form-elements">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter email">
          <small>Email is required</small>
        </div>
        <div class="form-elements">
          <label for="password">Password</label>
          <input type="text" id="password" placeholder="Enter password">
          <small>Password is required</small>
        </div>
        <div class="form-elements">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Confirm password">
          <small>Password not matched</small>
        </div>
        <button type="submit" id="submit-btn">Register</button>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
